
name: Build GREYLOCK Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get GREYLOCK source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare GREYLOCK application
        run: |
          npm init -y
          npm install @capacitor/core@^6.2.0 @capacitor/android@^6.2.0
          npm install --save-dev @capacitor/cli@^6.2.0
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nylock.greylock.offline",
            "appName": "Greylock",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload GREYLOCK APK
        uses: actions/upload-artifact@v4
        with:
          name: GREYLOCK-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

